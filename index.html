<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Surveillance AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Load TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <!-- Load the coco-ssd model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar / Control Panel -->
        <aside class="sidebar">
            <div class="logo-container">
                <div class="pulse-dot"></div>
                <h1>Vision<span class="highlight">AI</span></h1>
            </div>
            
            <p class="subtitle">Real-time object tracking & analytics</p>

            <div class="stats-card">
                <h3>Live Feed Stats</h3>
                <div class="stat-item">
                    <span class="stat-label">Total Objects</span>
                    <span class="stat-value" id="object-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Camera Status</span>
                    <span class="stat-value status-error" id="camera-status">Initializing...</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Model</span>
                    <span class="stat-value">COCO-SSD (TF.js)</span>
                </div>
            </div>

            <div class="info-section">
                <h4>System Logs</h4>
                <ul class="logs" id="logs-container">
                    <li>[SYSTEM] Application starting...</li>
                    <li>[AI] Loading TensorFlow.js model...</li>
                </ul>
            </div>
        </aside>

        <!-- Main Video Area -->
        <main class="video-section">
            <div class="video-header">
                <h2>Live Surveillance Feed</h2>
                <div class="live-badge">LIVE</div>
            </div>
            <div class="video-wrapper">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
                <!-- Techy corners -->
                <div class="crosshair crosshair-tl"></div>
                <div class="crosshair crosshair-tr"></div>
                <div class="crosshair crosshair-bl"></div>
                <div class="crosshair crosshair-br"></div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
